<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة البومة</title>
<style>body{font-family:system-ui,sans-serif;background:linear-gradient(#f3efff,#ffe9f6);margin:0;padding:20px;text-align:center}h1{font-size:1.2rem}.g{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}.c{background:#fff;border-radius:22px;padding:18px 26px;box-shadow:0 4px 16px #0001}.c b{display:block;margin-top:8px}:root{--pr:#7c3aed}.owl{display:block;flex:none;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}.owl *{transform-box:fill-box}
.o-b{transform-origin:50% 100%}.m-happy .o-b,.m-wave .o-b{animation:o-bob 3s ease-in-out infinite}.m-cheer .o-b{animation:o-jump 1.2s ease-in-out infinite}.m-sad .o-b{animation:o-sway 3.6s ease-in-out infinite}.hop .o-b{animation:o-jump .9s ease-in-out 1!important}
.o-wl{transform-origin:85% 10%}.o-wr{transform-origin:15% 10%}.m-happy .o-wl{animation:o-flapL 5s ease-in-out infinite}.m-happy .o-wr{animation:o-flapR 5s ease-in-out infinite .4s}.m-wave .o-wr{animation:o-wave 1.1s ease-in-out infinite}.m-cheer .o-wl{animation:o-flapL .4s ease-in-out infinite}.m-cheer .o-wr{animation:o-flapR .4s ease-in-out infinite}.m-sad .o-wl{transform:rotate(8deg)}.m-sad .o-wr{transform:rotate(-8deg)}
.o-pp{animation:o-look 7s ease-in-out infinite}.o-lid{transform:scaleY(0);transform-origin:50% 0;animation:o-blink 4.4s infinite}.o-tear{animation:o-tear 2.4s ease-in infinite}.o-pop{transform-origin:50% 50%;animation:o-pop 1.4s ease-out infinite;opacity:0}.m-cheer .o-sh{animation:o-shs 1.2s ease-in-out infinite;transform-origin:50% 50%}.hop .o-sh{animation:o-shs .9s ease-in-out 1}
@keyframes o-bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.012,.99)}}
@keyframes o-jump{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.07,.92)}38%{transform:translateY(-30px) scale(.96,1.06)}62%{transform:translateY(0) scale(1.06,.93)}78%{transform:translateY(-9px) scale(1,1)}90%{transform:translateY(0)}}
@keyframes o-sway{0%,100%{transform:rotate(-2.5deg) translateY(2px)}50%{transform:rotate(2.5deg) translateY(2px)}}
@keyframes o-flapL{0%,88%,100%{transform:rotate(0)}94%{transform:rotate(-14deg)}}@keyframes o-flapR{0%,88%,100%{transform:rotate(0)}94%{transform:rotate(14deg)}}
@keyframes o-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-58deg)}}
@keyframes o-look{0%,100%{transform:translate(0,0)}20%{transform:translate(3px,-1px)}45%{transform:translate(-3px,1px)}70%{transform:translate(2px,2px)}}
@keyframes o-blink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
@keyframes o-tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(24px);opacity:0}}
@keyframes o-pop{0%{transform:scale(0) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.2) rotate(160deg) translateY(-12px);opacity:0}}
@keyframes o-shs{0%,100%{transform:scale(1);opacity:.16}38%{transform:scale(.65);opacity:.07}}
.owi{position:relative;display:inline-block;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.owi img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;transform-origin:50% 100%;pointer-events:none;user-select:none;filter:drop-shadow(0 8px 10px #5b3fd940)}
.owi.m-happy img{animation:o-idle 3.4s ease-in-out infinite}.owi.m-wave img{animation:o-idle 2.6s ease-in-out infinite}.owi.m-cheer img{animation:o-jump 1.2s ease-in-out infinite}.owi.m-sad img{animation:o-sway 3.6s ease-in-out infinite}.owi.hop img{animation:o-jump .9s ease-in-out 1!important}
.osp{position:absolute;font-style:normal;font-size:20px;opacity:0;animation:o-pop 1.4s ease-out infinite;pointer-events:none}
@keyframes o-idle{0%,100%{transform:rotate(-1.4deg) scale(1,1)}50%{transform:rotate(1.4deg) scale(1.018,.985)}}
@media(prefers-reduced-motion:reduce){.owi img,.osp{animation:none!important}.osp{display:none}}
.owi{position:relative;display:inline-block;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.owi img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;transform-origin:50% 100%;pointer-events:none;user-select:none;filter:drop-shadow(0 8px 10px #5b3fd940)}
.owi.m-happy img{animation:o-idle 3.4s ease-in-out infinite}.owi.m-wave img{animation:o-idle 2.6s ease-in-out infinite}.owi.m-cheer img{animation:o-jump 1.2s ease-in-out infinite}.owi.m-sad img{animation:o-sway 3.6s ease-in-out infinite}.owi.hop img{animation:o-jump .9s ease-in-out 1!important}
.osp{position:absolute;font-style:normal;font-size:20px;opacity:0;animation:o-pop 1.4s ease-out infinite;pointer-events:none}
@keyframes o-idle{0%,100%{transform:rotate(-1.4deg) scale(1,1)}50%{transform:rotate(1.4deg) scale(1.018,.985)}}
@media(prefers-reduced-motion:reduce){.owi img,.osp{animation:none!important}.osp{display:none}}
@media(prefers-reduced-motion:reduce){.owl,.owl *,.owi img,.osp{animation:none!important}}</style>
<h1>🦉 البومة — اضغط عليها وهتنطّ!</h1><div class="g" id="g"></div><script>let OWLN=0;
function owlSvg(m,z){m=m||'happy';z=z||96;const n=++OWLN,I=x=>x+n,cheer=m==='cheer',sad=m==='sad',
 star=(x,y,c,d)=>'<g class="o-pop" style="animation-delay:'+d+'s"><path d="M'+x+' '+(y-9)+' L'+(x+3)+' '+(y-3)+' L'+(x+9)+' '+(y-3)+' L'+(x+4)+' '+(y+2)+' L'+(x+6)+' '+(y+9)+' L'+x+' '+(y+5)+' L'+(x-6)+' '+(y+9)+' L'+(x-4)+' '+(y+2)+' L'+(x-9)+' '+(y-3)+' L'+(x-3)+' '+(y-3)+'Z" fill="'+c+'"/></g>',
 eyeO=x=>'<g><circle cx="'+x+'" cy="86" r="24" fill="#fff" stroke="#d9cfff" stroke-width="2.5"/><g class="o-pp"><circle cx="'+x+'" cy="'+(sad?90:87)+'" r="15" fill="#34228a"/><circle cx="'+x+'" cy="'+(sad?90:87)+'" r="10" fill="#150d3d"/><circle cx="'+(x+5)+'" cy="'+(sad?84:81)+'" r="5.5" fill="#fff"/><circle cx="'+(x-5)+'" cy="'+(sad?96:93)+'" r="2.6" fill="#fff" opacity=".9"/></g><ellipse class="o-lid" cx="'+x+'" cy="86" rx="26" ry="26" fill="#f1ebff"/></g>',
 eyeH=x=>'<path d="M'+(x-17)+' 90 Q'+x+' 66 '+(x+17)+' 90" stroke="#2a1b6e" stroke-width="7" fill="none" stroke-linecap="round"/>',
 brows=sad?'<path d="M48 70 Q66 58 90 56" stroke="#3b2aa0" stroke-width="5.5" fill="none" stroke-linecap="round"/><path d="M152 70 Q134 58 110 56" stroke="#3b2aa0" stroke-width="5.5" fill="none" stroke-linecap="round"/>':
  '<path d="M52 '+(cheer?52:58)+' Q72 '+(cheer?42:50)+' 92 '+(cheer?52:58)+'" stroke="#3b2aa0" stroke-width="5.5" fill="none" stroke-linecap="round"/><path d="M108 '+(cheer?52:58)+' Q128 '+(cheer?42:50)+' 148 '+(cheer?52:58)+'" stroke="#3b2aa0" stroke-width="5.5" fill="none" stroke-linecap="round"/>',
 beak=(cheer?'<path d="M90 112 Q100 140 110 112Z" fill="#d9480f"/><ellipse cx="100" cy="127" rx="6" ry="4" fill="#ff8fa3"/>':'')+'<path d="M100 96 C 87 96 85 109 100 126 C 115 109 113 96 100 96Z" fill="url(#'+I('k')+')"/><path d="M95 103 Q100 100 105 103" stroke="#fff" stroke-width="2.5" opacity=".55" fill="none" stroke-linecap="round"/>'+(cheer?'':'<path d="M93 116 Q100 121 107 116" stroke="#d9780f" stroke-width="2" fill="none" opacity=".6"/>'),
 cap='<g class="o-cap"><path d="M56 36 L100 16 L144 36 L100 54Z" fill="#26307a"/><path d="M76 44 L76 56 Q100 68 124 56 L124 44 L100 54Z" fill="#1b2263"/><circle cx="100" cy="35" r="4.5" fill="#ffd34d"/><path d="M144 36 L150 60" stroke="#ffd34d" stroke-width="3.5" stroke-linecap="round"/><circle cx="150" cy="62" r="5" fill="#ffd34d"/></g>';
 return '<svg class="owl m-'+m+'" width="'+z+'" height="'+Math.round(z*1.12)+'" viewBox="0 0 200 224" role="img" aria-label="البومة" onclick="owlHop(this)"><defs>'+
 '<linearGradient id="'+I('b')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c80ff"/><stop offset="1" stop-color="#5a3ed8"/></linearGradient>'+
 '<linearGradient id="'+I('w')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7656f0"/><stop offset="1" stop-color="#4a31b6"/></linearGradient>'+
 '<linearGradient id="'+I('l')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ffe3b3"/></linearGradient>'+
 '<linearGradient id="'+I('k')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd35c"/><stop offset="1" stop-color="#ff9b1f"/></linearGradient></defs>'+
 '<ellipse class="o-sh" cx="100" cy="216" rx="56" ry="7" fill="#000" opacity=".16"/><g class="o-b">'+
 '<g fill="#ffa726"><ellipse cx="68" cy="208" rx="7" ry="4.5"/><ellipse cx="80" cy="211" rx="7" ry="4.5"/><ellipse cx="92" cy="208" rx="7" ry="4.5"/><ellipse cx="108" cy="208" rx="7" ry="4.5"/><ellipse cx="120" cy="211" rx="7" ry="4.5"/><ellipse cx="132" cy="208" rx="7" ry="4.5"/></g>'+
 '<path d="M44 54 C 32 30 38 12 52 8 C 60 24 72 36 86 42Z" fill="#7656f0"/><path d="M156 54 C 168 30 162 12 148 8 C 140 24 128 36 114 42Z" fill="#7656f0"/>'+
 '<path d="M100 26 C 52 26 30 66 32 112 C 33 160 56 208 100 208 C 144 208 167 160 168 112 C 170 66 148 26 100 26Z" fill="url(#'+I('b')+')"/>'+
 '<ellipse cx="100" cy="164" rx="45" ry="42" fill="url(#'+I('l')+')"/><g stroke="#efc27d" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"><path d="M60 144 q10 11 20 0 q10 11 20 0 q10 11 20 0 q10 11 20 0"/><path d="M68 164 q10 11 20 0 q10 11 20 0 q10 11 20 0"/><path d="M76 184 q10 11 20 0 q10 11 20 0"/></g>'+
 '<g class="o-wl"><path d="M46 112 C 14 124 10 178 40 198 C 58 184 64 146 58 118Z" fill="url(#'+I('w')+')"/><path d="M28 152 Q37 164 46 152 M24 172 Q34 184 44 172" stroke="#9b82ff" stroke-width="3" fill="none" stroke-linecap="round"/></g>'+
 '<g class="o-wr"><path d="M154 112 C 186 124 190 178 160 198 C 142 184 136 146 142 118Z" fill="url(#'+I('w')+')"/><path d="M172 152 Q163 164 154 152 M176 172 Q166 184 156 172" stroke="#9b82ff" stroke-width="3" fill="none" stroke-linecap="round"/></g>'+
 '<path d="M100 58 C 78 40 36 52 38 90 C 40 116 70 122 100 108 C 130 122 160 116 162 90 C 164 52 122 40 100 58Z" fill="#f7f3ff"/>'+
 (cheer?eyeH(72)+eyeH(128):eyeO(72)+eyeO(128))+brows+'<circle cx="52" cy="108" r="8" fill="#ff8fb1" opacity=".5"/><circle cx="148" cy="108" r="8" fill="#ff8fb1" opacity=".5"/>'+beak+
 (sad?'<path class="o-tear" d="M54 104 q-7 13 0 18 q7 -5 0 -18Z" fill="#7dd3fc"/>':'')+cap+'</g>'+
 (cheer?'<g class="o-cf">'+star(24,44,'#ffd34d',0)+star(176,40,'#ff7eb6',.25)+star(14,104,'#5eead4',.5)+star(188,100,'#ffd34d',.75)+star(100,6,'#ff7eb6',1)+star(150,12,'#5eead4',.4)+'</g>':'')+'</svg>'}
const OWL_IMG={happy:'owl-idle.webp',wave:'owl-welcome.webp',cheer:'owl-correct.webp',sad:'owl-sad.webp',hop:'owl-hop.webp'};
function owl(m,z){m=m||'happy';z=z||96;const src=OWL_IMG[m]||OWL_IMG.happy,sp=m==='cheer'?['⭐|2%|8%|0','✨|88%|4%|.3','💫|0%|52%|.6','🌟|92%|48%|.9','✨|46%|-6%|1.1'].map(t=>{const a=t.split('|');return '<i class="osp" style="left:'+a[1]+';top:'+a[2]+';animation-delay:'+a[3]+'s">'+a[0]+'</i>'}).join(''):'';
 return '<span class="owi m-'+m+'" data-m="'+m+'" style="width:'+z+'px;height:'+Math.round(z*1.12)+'px" onclick="owlHop(this)"><img src="'+src+'" alt="البومة" draggable="false" onerror="owlFb(this,\''+m+'\','+z+')">'+sp+'</span>'}
function owlFb(img,m,z){const w=img.closest('.owi');if(w)w.outerHTML=owlSvg(m,z)}
function owlHop(el){if(el.classList.contains('owi')){const im=el.querySelector('img');if(!im||el.classList.contains('hop'))return;const prev=im.getAttribute('src');im.src=OWL_IMG.hop;el.classList.add('hop');clearTimeout(el._t);el._t=setTimeout(()=>{el.classList.remove('hop');im.src=prev},950)}else{el.classList.add('hop');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('hop'),1000)}}

const M=[['wave','بتسلّم (الصفحة الرئيسية)'],['happy','عادية'],['cheer','إجابة صح'],['sad','إجابة غلط']];
document.getElementById('g').innerHTML=M.map(([k,t])=>'<div class="c">'+owl(k,200)+'<b>'+t+'</b></div>').join('');</script></html>
