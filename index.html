function shrink(f){return new Promise(res=>{if(!/^image\/(jpeg|png|webp)/.test(f.type))return res(f);const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(b=>res(b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f),'image/jpeg',0.8)};
 im.onerror=()=>{URL.revokeObjectURL(u);res(f)};im.src=u})}

function sHw(s){return LS(s.id).map(l=>{const h=S.hw[l.id]?.[s.id];return `<div class="card"><h3>حصة ${esc(l.n)}: ${esc(l.t)}</h3><p><b>الواجب:</b> ${esc(l.h)||'—'}</p>
${h?`<span class="b ok">تم التسليم</span> ${h.file?`<span class="mu">${esc(h.file)}</span>`:''}<p>${esc(h.text||'')}</p>${h.grade!==undefined&&h.grade!==''?`<p>الدرجة: <b>${esc(h.grade)}</b> — ${esc(h.fb||'')}</p>`:'<p class="mu">بانتظار التصحيح</p>'}`:
`<textarea id="t${l.id}" placeholder="اكتبي حل الواجب هنا"></textarea><div class="row"><input type="file" id="fl${l.id}" accept="image/*,.pdf"><button onclick="sub('${l.id}','${s.id}')">رفع الحل</button></div>`}</div>`}).join('')||'<div class="card mu">لا توجد واجبات</div>'}
function sub(l,s){const t=$('#t'+l).value.trim(),f=$('#fl'+l).files[0];if(!t&&!f)return alert('اكتب الحل أو ارفع ملفاً');(S.hw[l]=S.hw[l]||{})[s]={text:t,file:f?f.name:'',at:Date.now()};dclr('t'+l);save()}
function sTu(s){return `<div class="card"><h3>اسألي مساعدك الذكي</h3><p class="mu">اشرح لي جزءاً من الدرس أو ساعدني في فهم خطأ في الواجب.</p><select id="tl">${LS(s.id).map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)}</option>`).join('')}</select><textarea id="tq" placeholder="اكتب سؤالك"></textarea><button onclick="tutor()">اسأل</button><div id="to" class="ai" hidden></div></div>`}
async function tutor(){const l=S.lessons.find(x=>x.id===$('#tl').value),q=$('#tq').value.trim();if(!q)return;const o=$('#to');o.hidden=false;
 await ask(`أنت مدرّس لطيف يشرح لطالب بأسلوب بسيط ومشجع بالعربية، دون إعطاء الحل النهائي للواجب مباشرة بل بتوجيهه خطوة بخطوة.\nالدرس: ${l?l.t:''}\nالمحتوى: ${l?l.c:''}\nسؤال الطالب: ${q}`,o)}
// ---------- Parent
function parentV(){const s=stu(who.id);if(!s){logout();return''}
 const T=[['hm','🏠 الرئيسية · Home'],['sm','📊 الملخص'],['gr','📈 الدرجات'],['pm','💳 المدفوعات'],['pg','🏅 Progress · التقدم'],['cl','🗓️ Calendar · التقويم']];
 return hdr('👨‍👩‍👧 ولي أمر '+esc(s.name)+' · Parent',T)+({hm:pHm,sm:s=>pSm(s)+repCard(s),gr:pGr,pm:pPm,pg:prog,cl:s=>calV(LS(s.id))}[tab])(s)}
function pSm(s){return `<div class="row"><div class="card" style="flex:1">الحضور<h2>${attPct(s.id)}%</h2></div><div class="card" style="flex:1">Level · المستوى<h2 style="font-size:1rem">${bdgTxt(s.id)}</h2></div><div class="card" style="flex:1">المتبقي<h2>${due(s.id)} ج</h2></div></div>
<div class="card sc"><table><tr><th>الحصة</th><th>الموضوع</th><th>الحضور</th></tr>${LS(s.id).map(l=>{const v=S.att[l.id]?.[s.id];return `<tr><td>${esc(l.n)}</td><td>${esc(l.t)}</td><td>${v==='p'?'<span class="b ok">حضر</span>':v==='a'?'<span class="b no">غاب</span>':'—'}</td></tr>`}).join('')}</table></div>
<div class="card"><h3>ملاحظات المعلمة</h3><p>${esc(S.notes[s.id])||'<span class="mu">لا توجد ملاحظات</span>'}</p></div>`}
function pGr(s){return `<div class="card sc"><table><tr><th>الحصة</th><th>الدرجة</th><th>ملاحظة</th></tr>${LS(s.id).map(l=>{const h=S.hw[l.id]?.[s.id];return `<tr><td>${esc(l.t)}</td><td>${h?esc(h.grade??'قيد التصحيح'):'لم يسلّم'}</td><td>${esc(h?.fb||'')}</td></tr>`}).join('')}</table></div>`}
function pPm(s){const A=LS(s.id),pf=S.files.filter(f=>f.purpose==='proof'&&f.sid===s.id).sort((x,y)=>y.at-x.at);
return `<div class="card"><h3>📤 رفع إثبات الدفع</h3><p class="mu">ارفعوا صورة (سكرين شوت) من عملية الدفع، والمعلمة هتراجعها.</p>
<div style="display:flex;flex-direction:column;gap:8px;max-width:420px"><select id="pl"><option value="">دفعة عامة (شهر أو أكثر من حصة)</option>${A.map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)} — ${esc(l.price)} ج</option>`).join('')}</select>
<input type="file" id="pf" accept="image/*"><button onclick="upProof('${s.id}')">📤 رفع سكرين شوت</button><div id="pe2" class="mu"></div></div></div>`+
(A.length?`<div class="card"><h3>💵 أسعار الحصص</h3>${A.map(l=>`<div class="top"><span>حصة ${esc(l.n)}: ${esc(l.t)}</span><span class="b">${esc(l.price)} ج</span></div>`).join('')}</div>`:'')+
`<div class="card"><h3>📎 الصور اللي اترفعت</h3>${pf.map(f=>{const l=S.lessons.find(x=>x.id===f.lid);return `<div class="mu">📎 ${l?'حصة '+esc(l.n)+': '+esc(l.t):'دفعة عامة'} · ${new Date(f.at).toLocaleDateString('ar-EG')}</div>`}).join('')||'<span class="mu">لسه ما اترفعش حاجة</span>'}</div>`}
async function upProof(sid){const f=$('#pf').files[0],e=$('#pe2');if(!f){e.style.color='var(--bad)';e.textContent='اختاري صورة الأول';return}
 e.style.color='';e.textContent='جاري الرفع…';try{await fput(f,{purpose:'proof',lid:$('#pl').value||''});render();alert('تم رفع الصورة ✅')}catch(x){e.style.color='var(--bad)';e.textContent='تعذّر الرفع: '+(x.message||x)}}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
uiInit();
init();
</script></body></html>
