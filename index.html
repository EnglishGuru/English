function tHw(){return S.lessons.map(l=>`<div class="card"><h3>حصة ${esc(l.n)}: ${esc(l.t)}</h3>${ST(l).map(s=>{const h=S.hw[l.id]?.[s.id];return `<div class="row" style="border-top:1px solid var(--bd);padding-top:6px"><b style="min-width:110px">${esc(s.name)}</b>${h?`<span class="b ok">سلّم</span><span class="mu">${esc(h.file||'')}</span><div style="flex-basis:100%">${esc(h.text||'')}</div>
<input type="number" id="g${l.id}${s.id}" placeholder="الدرجة" value="${h.grade??''}" style="width:90px"><input id="f${l.id}${s.id}" placeholder="ملاحظة" value="${esc(h.fb||'')}" style="flex:1"><button onclick="grade('${l.id}','${s.id}')">حفظ</button><button class="s" onclick="aiGrade('${l.id}','${s.id}',this)">🤖 تصحيح ذكي</button><div class="ai" id="o${l.id}${s.id}" hidden></div>`:'<span class="b no">لم يسلّم</span>'}</div>`}).join('')||'<p class="mu">أضيفي طلاباً أولاً</p>'}</div>`).join('')||'<div class="card mu">لا توجد حصص</div>'}
function grade(l,s){const h=S.hw[l][s];h.grade=$('#g'+l+s).value;h.fb=$('#f'+l+s).value;save()}
async function aiGrade(l,s,btn){const L=S.lessons.find(x=>x.id===l),h=S.hw[l][s],o=$('#o'+l+s);o.hidden=false;
 await ask(`أنت معلمة مساعدة. الدرس: ${L.t}. المحتوى: ${L.c}. الواجب المطلوب: ${L.h}.\nإجابة الطالب: ${h.text||'(لم يكتب نصاً)'}\nصحّحي الإجابة، اذكري الدرجة من 10 في أول سطر بصيغة "الدرجة: X/10"، ثم اشرحي الأخطاء بأسلوب مشجع وبسيط بالعربية.`,o)}
function tAt(){return S.lessons.map(l=>`<div class="card"><h3>حصة ${esc(l.n)}: ${esc(l.t)}</h3>${ST(l).map(s=>{const v=S.att[l.id]?.[s.id];return `<div class="row"><b style="min-width:110px">${esc(s.name)}</b><button class="${v==='p'?'':'s'}" onclick="setAt('${l.id}','${s.id}','p')">حاضر</button><button class="${v==='a'?'d':'s'}" onclick="setAt('${l.id}','${s.id}','a')">غائب</button></div>`}).join('')}</div>`).join('')||'<div class="card mu">لا توجد حصص</div>'}
function setAt(l,s,v){(S.att[l]=S.att[l]||{})[s]=v;save()}
function tPm(){return tPf()+`<div class="card sc"><table><tr><th>الطالب</th><th>مدفوع</th><th>متأخرات</th>${S.lessons.map(l=>`<th>ح${esc(l.n)}</th>`).join('')}</tr>${S.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${paid(s.id)}</td><td>${due(s.id)}</td>${S.lessons.map(l=>!fo(l,s.id)?'<td class="mu">—</td>':`<td><input type="checkbox" ${S.pay[l.id]?.[s.id]?'checked':''} onchange="setPay('${l.id}','${s.id}',this.checked)"></td>`).join('')}</tr>`).join('')}</table></div>`}
function setPay(l,s,v){(S.pay[l]=S.pay[l]||{})[s]=v?{at:new Date().toLocaleDateString('ar-EG'),m:'يدوي'}:null;save()}
function tNt(){return S.students.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><textarea id="n${s.id}" placeholder="ملاحظات وتقييم عن السلوك والمستوى">${esc(S.notes[s.id]||'')}</textarea><button onclick="S.notes['${s.id}']=$('#n${s.id}').value;save()">حفظ</button></div>`).join('')||'<div class="card mu">لا يوجد طلاب</div>'}
const fn=n=>String(n||'').trim().split(/\s+/)[0];
function lbData(){return (S.lb||S.students.map(s=>({id:s.id,name:s.name,a:pts(s.id)}))).slice().sort((x,y)=>y.a-x.a||String(x.name).localeCompare(y.name,'ar'))}
function tLb(){return lb()}
function lb(){const d=lbData();let rk=0,pv=null;return `<div class="card"><h3>🏆 Wall of Fame</h3>${d.map((x,i)=>{if(x.a!==pv){rk=i+1;pv=x.a}const l=lvl(x.a);return `<div class="row"><span style="font-size:1.4rem;min-width:36px">${['🥇','🥈','🥉'][rk-1]||'#'+rk}</span><b>${esc(fn(x.name))}</b><span class="b">${l.name} ${l.ic}</span><span class="mu">${x.a} pts</span></div>`}).join('')||'<span class="mu">لا بيانات</span>'}</div>
<div class="card"><h3>🎯 Levels</h3>${LV.map((x,i)=>`<div class="row"><span style="min-width:36px;font-size:1.3rem">${x[2]}</span><b>${x[1]}</b><span class="mu">${x[0]}${LV[i+1]?'–'+(LV[i+1][0]-1):'+'} pts</span></div>`).join('')}<p class="mu">النقاط: حضور حصة +2 · تسليم واجب +3 · درجة الواجب حتى +10 · كتابة اتراجعت +5</p></div>`}
function tAi(){return `<div class="card"><h3>توليد أسئلة واختبار لحصة</h3><div class="row"><select id="qs">${S.lessons.map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)}</option>`).join('')}</select><button onclick="genQ()">🤖 ولّدي الأسئلة</button></div><div id="qo" class="ai" hidden></div></div>
<div class="card"><h3>تقرير ولي الأمر</h3><div class="row"><select id="rs">${S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button onclick="genRep('rs','ro')">🤖 اكتبي التقرير</button></div><div id="ro" class="ai" contenteditable="true" hidden></div><div class="row"><button class="s" onclick="sendRep()">📨 إرسال لولي الأمر</button></div><p class="mu">تقدري تعدّلي في النص قبل الإرسال.</p></div>`}
async function genQ(){const l=S.lessons.find(x=>x.id===$('#qs').value);if(!l)return;const o=$('#qo');o.hidden=false;
 await ask(`اعتمادًا على هذه الحصة، ولّد 8 أسئلة متنوعة (اختيار من متعدد وصح/خطأ ومقالي) مع الإجابات النموذجية بالعربية.\nالدرس: ${l.t}\nالمحتوى: ${l.c}`,o);S.quiz[l.id]=o.textContent;pq=pq.then(push).catch(()=>{})}
async function genRep(sel,out){const s=stu($('#'+sel).value);if(!s)return;const o=$('#'+out);o.hidden=false;
 const hw=LS(s.id).map(l=>`حصة ${l.n} (${l.t}): ${S.att[l.id]?.[s.id]==='p'?'حضر':S.att[l.id]?.[s.id]==='a'?'غاب':'—'}، واجب: ${S.hw[l.id]?.[s.id]?(S.hw[l.id][s.id].grade||'لم يُصحَّح'):'لم يسلّم'}`).join('\n');
 await ask(`اكتب تقريراً احترافياً ودوداً بالعربية لولي أمر الطالب ${s.name}، من 5-7 أسطر، يشمل المستوى ونقاط القوة وما يحتاج تحسين ونصيحة.\nنسبة الحضور: ${attPct(s.id)}%، متوسط الواجبات: ${avg(s.id)}\nالتفاصيل:\n${hw}\nملاحظات المعلمة: ${S.notes[s.id]||'لا توجد'}`,o)}
// ---------- Student
function studentV(){const s=stu(who.id);if(!s){logout();return''}
 const ad=!!s.grp,K=[['ls','📚 الحصص'],['hw','📝 الواجبات'],['wr','✍️ My Writing · كتاباتي'],['pg','📈 My Progress · تقدمي'],['lb','🏆 Wall of Fame'],['tu','💬 My Questions · أسئلتي']],
 T=(ad?[['sm','📊 Summary · الملخص'],K[0],K[1],K[2],K[3],['gr','📈 Grades · الدرجات'],['pm','💳 Payments · المدفوعات'],K[4],K[5]]:K).concat([['cl','🗓️ Calendar · التقويم']]),
 V={ls:sLs,hw:sHw,lb:()=>lb(),tu:sQ,wr:sW,pg:prog,sm:x=>pSm(x)+repCard(x),gr:pGr,pm:pPm,cl:x=>calV(LS(x.id))};
 if(!V[tab])tab=ad?'sm':'ls';const g=GR.find(x=>x[0]===(s.grp||''));
 return hdr('🎓 أهلاً '+esc(s.name)+' · Welcome!',T,null,ad?['sm','ls','hw','pm']:['ls','hw','wr','pg'])+(ad?`<div class="mu" style="margin:-6px 0 8px">${g[1]}</div>`:'')+(['pg','sm'].includes(tab)?'':bdg(s.id))+V[tab](s)}
function sLs(){const td=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),A=LS(who.id),
 dn=l=>l.d?new Date(l.d+'T00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}):'بدون تاريخ',
 done=A.filter(l=>l.d&&l.d<td).sort((a,b)=>b.d.localeCompare(a.d)),cur=A.filter(l=>!l.d||l.d===td).sort((a,b)=>(+a.n||0)-(+b.n||0)),up=A.filter(l=>l.d&&l.d>td).sort((a,b)=>a.d.localeCompare(b.d)),
 card=(l,t,c)=>`<div class="card"><div class="top"><h3>حصة ${esc(l.n)}: ${esc(l.t)}</h3><span class="b ${c}">${t}</span></div><span class="mu">📅 ${dn(l)}</span><p>${esc(l.c)}</p></div>`,
 sec=(h,L,t,c,em)=>`<h3 style="margin-top:18px">${h} <span class="mu">(${L.length})</span></h3>${L.map(l=>card(l,t,c)).join('')||`<div class="card mu">${em}</div>`}`;
 if(!A.length)return '<div class="card mu">لا توجد حصص بعد</div>';
 return sec('📍 Current · الحالية',cur,'Today','ok','مفيش حصة النهاردة'+(up[0]?' — الحصة الجاية '+dn(up[0]):''))+sec('⏭️ Upcoming · القادمة',up,'Soon','','مفيش حصص قادمة لسه')+sec('✅ Completed · المنتهية',done,'Done','','مفيش حصص منتهية لسه')}
function sHw(s){return LS(s.id).map(l=>{const h=S.hw[l.id]?.[s.id];return `<div class="card"><h3>حصة ${esc(l.n)}: ${esc(l.t)}</h3><p><b>الواجب:</b> ${esc(l.h)||'—'}</p>
${h?`<span class="b ok">تم التسليم</span> ${h.file?`<span class="mu">${esc(h.file)}</span>`:''}<p>${esc(h.text||'')}</p>${h.grade!==undefined&&h.grade!==''?`<p>الدرجة: <b>${esc(h.grade)}</b> — ${esc(h.fb||'')}</p>`:'<p class="mu">بانتظار التصحيح</p>'}`:
`<textarea id="t${l.id}" placeholder="اكتبي حل الواجب هنا"></textarea><div class="row"><input type="file" id="fl${l.id}" accept="image/*,.pdf"><button onclick="sub('${l.id}','${s.id}')">رفع الحل</button></div>`}</div>`}).join('')||'<div class="card mu">لا توجد واجبات</div>'}
function sub(l,s){const t=$('#t'+l).value.trim(),f=$('#fl'+l).files[0];if(!t&&!f)return alert('اكتب الحل أو ارفع ملفاً');(S.hw[l]=S.hw[l]||{})[s]={text:t,file:f?f.name:'',at:Date.now()};dclr('t'+l);save()}
function sTu(s){return `<div class="card"><h3>اسألي مساعدك الذكي</h3><p class="mu">اشرح لي جزءاً من الدرس أو ساعدني في فهم خطأ في الواجب.</p><select id="tl">${LS(s.id).map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)}</option>`).join('')}</select><textarea id="tq" placeholder="اكتب سؤالك"></textarea><button onclick="tutor()">اسأل</button><div id="to" class="ai" hidden></div></div>`}
async function tutor(){const l=S.lessons.find(x=>x.id===$('#tl').value),q=$('#tq').value.trim();if(!q)return;const o=$('#to');o.hidden=false;
 await ask(`أنت مدرّس لطيف يشرح لطالب بأسلوب بسيط ومشجع بالعربية، دون إعطاء الحل النهائي للواجب مباشرة بل بتوجيهه خطوة بخطوة.\nالدرس: ${l?l.t:''}\nالمحتوى: ${l?l.c:''}\nسؤال الطالب: ${q}`,o)}
// ---------- Parent
function parentV(){const s=stu(who.id);if(!s){logout();return''}
 const T=[['sm','📊 الملخص'],['gr','📈 الدرجات'],['pm','💳 المدفوعات'],['pg','🏅 Progress · التقدم'],['cl','🗓️ Calendar · التقويم']];
 return hdr('👨‍👩‍👧 ولي أمر '+esc(s.name)+' · Parent',T)+({sm:s=>pSm(s)+repCard(s),gr:pGr,pm:pPm,pg:prog,cl:s=>calV(LS(s.id))}[tab])(s)}
function pSm(s){return `<div class="row"><div class="card" style="flex:1">الحضور<h2>${attPct(s.id)}%</h2></div><div class="card" style="flex:1">Level · المستوى<h2 style="font-size:1rem">${bdgTxt(s.id)}</h2></div><div class="card" style="flex:1">المتبقي<h2>${due(s.id)} ج</h2></div></div>
<div class="card sc"><table><tr><th>الحصة</th><th>الموضوع</th><th>الحضور</th></tr>${LS(s.id).map(l=>{const v=S.att[l.id]?.[s.id];return `<tr><td>${esc(l.n)}</td><td>${esc(l.t)}</td><td>${v==='p'?'<span class="b ok">حضر</span>':v==='a'?'<span class="b no">غاب</span>':'—'}</td></tr>`}).join('')}</table></div>
<div class="card"><h3>ملاحظات المعلمة</h3><p>${esc(S.notes[s.id])||'<span class="mu">لا توجد ملاحظات</span>'}</p></div>`}
function pGr(s){return `<div class="card sc"><table><tr><th>الحصة</th><th>الدرجة</th><th>ملاحظة</th></tr>${LS(s.id).map(l=>{const h=S.hw[l.id]?.[s.id];return `<tr><td>${esc(l.t)}</td><td>${h?esc(h.grade??'قيد التصحيح'):'لم يسلّم'}</td><td>${esc(h?.fb||'')}</td></tr>`}).join('')}</table></div>`}
function pPm(s){const A=LS(s.id),pf=S.files.filter(f=>f.purpose==='proof'&&f.sid===s.id).sort((x,y)=>y.at-x.at);
return `<div class="card"><h3>📤 رفع إثبات الدفع</h3><p class="mu">ارفعوا صورة (سكرين شوت) من عملية الدفع، والمعلمة هتراجعها.</p>
<div style="display:flex;flex-direction:column;gap:8px;max-width:420px"><select id="pl"><option value="">دفعة عامة (شهر أو أكثر من حصة)</option>${A.map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)} — ${esc(l.price)} ج</option>`).join('')}</select>
<input type="file" id="pf" accept="image/*"><button onclick="upProof('${s.id}')">📤 رفع سكرين شوت</button><div id="pe2" class="mu"></div></div></div>`+
(A.length?`<div class="card"><h3>💵 أسعار الحصص</h3>${A.map(l=>`<div class="top"><span>حصة ${esc(l.n)}: ${esc(l.t)}</span><span class="b">${esc(l.price)} ج</span></div>`).join('')}</div>`:'')+
`<div class="card"><h3>📎 الصور اللي اترفعت</h3>${pf.map(f=>{const l=S.lessons.find(x=>x.id===f.lid);return `<div class="mu">📎 ${l?'حصة '+esc(l.n)+': '+esc(l.t):'دفعة عامة'} · ${new Date(f.at).toLocaleDateString('ar-EG')}</div>`}).join('')||'<span class="mu">لسه ما اترفعش حاجة</span>'}</div>`}
async function upProof(sid){const f=$('#pf').files[0],e=$('#pe2');if(!f){e.style.color='var(--bad)';e.textContent='اختاري صورة الأول';return}
 e.style.color='';e.textContent='جاري الرفع…';try{await fput(f,{purpose:'proof',lid:$('#pl').value||''});render();alert('تم رفع الصورة ✅')}catch(x){e.style.color='var(--bad)';e.textContent='تعذّر الرفع: '+(x.message||x)}}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
uiInit();
init();
</script></body></html>
