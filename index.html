function sTu(s){return `<div class="card"><h3>اسألي مساعدك الذكي</h3><p class="mu">اشرح لي جزءاً من الدرس أو ساعدني في فهم خطأ في الواجب.</p><select id="tl">${LS(s.id).map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)}</option>`).join('')}</select><textarea id="tq" placeholder="اكتب سؤالك"></textarea><button onclick="tutor()">اسأل</button><div id="to" class="ai" hidden></div></div>`}
async function tutor(){const l=S.lessons.find(x=>x.id===$('#tl').value),q=$('#tq').value.trim();if(!q)return;const o=$('#to');o.hidden=false;
 await ask(`أنت مدرّس لطيف يشرح لطالب بأسلوب بسيط ومشجع بالعربية، دون إعطاء الحل النهائي للواجب مباشرة بل بتوجيهه خطوة بخطوة.\nالدرس: ${l?l.t:''}\nالمحتوى: ${l?l.c:''}\nسؤال الطالب: ${q}`,o)}
// ---------- Parent
function parentV(){const s=stu(who.id);if(!s){logout();return''}
 const T=[['sm','📊 الملخص'],['gr','📈 الدرجات'],['pm','💳 المدفوعات'],['pg','🏅 Progress · التقدم']];
 return hdr('👨‍👩‍👧 ولي أمر '+esc(s.name)+' · Parent',T)+({sm:s=>pSm(s)+repCard(s),gr:pGr,pm:pPm,pg:prog}[tab])(s)}
function pSm(s){return `<div class="row"><div class="card" style="flex:1">الحضور<h2>${attPct(s.id)}%</h2></div><div class="card" style="flex:1">Level · المستوى<h2 style="font-size:1rem">${bdgTxt(s.id)}</h2></div><div class="card" style="flex:1">المتبقي<h2>${due(s.id)} ج</h2></div></div>
<div class="card sc"><table><tr><th>الحصة</th><th>الموضوع</th><th>الحضور</th></tr>${LS(s.id).map(l=>{const v=S.att[l.id]?.[s.id];return `<tr><td>${esc(l.n)}</td><td>${esc(l.t)}</td><td>${v==='p'?'<span class="b ok">حضر</span>':v==='a'?'<span class="b no">غاب</span>':'—'}</td></tr>`}).join('')}</table></div>
<div class="card"><h3>ملاحظات المعلمة</h3><p>${esc(S.notes[s.id])||'<span class="mu">لا توجد ملاحظات</span>'}</p></div>`}
function pGr(s){return `<div class="card sc"><table><tr><th>الحصة</th><th>الدرجة</th><th>ملاحظة</th></tr>${LS(s.id).map(l=>{const h=S.hw[l.id]?.[s.id];return `<tr><td>${esc(l.t)}</td><td>${h?esc(h.grade??'قيد التصحيح'):'لم يسلّم'}</td><td>${esc(h?.fb||'')}</td></tr>`}).join('')}</table></div>`}
function pPm(s){return `<div class="card"><p class="mu">ارفعوا صورة (سكرين شوت) من عملية الدفع لكل حصة، والمعلمة هتراجعها.</p></div>`+LS(s.id).map(l=>{const pf=S.files.filter(f=>f.purpose==='proof'&&f.sid===s.id&&f.lid===l.id);return `<div class="card"><div class="top"><b>حصة ${esc(l.n)}: ${esc(l.t)}</b><span class="b">${esc(l.price)} ج</span></div>${pf.map(f=>`<div class="mu">📎 تم رفع صورة · ${new Date(f.at).toLocaleDateString('ar-EG')}</div>`).join('')}<div class="row"><input type="file" id="pf${l.id}" accept="image/*"><button onclick="upProof('${l.id}','${s.id}')">📤 رفع سكرين شوت</button></div></div>`}).join('')||'<div class="card mu">لا توجد حصص</div>'}
async function upProof(l,s){const f=$('#pf'+l).files[0];if(!f)return alert('اختاري صورة الأول');try{await fput(f,{purpose:'proof',lid:l});render()}catch(e){alert('تعذر الرفع: '+(e.message||e))}}

init();
</script></body></html>
