function tLb(){return lb()}
function lb(){const d=lbData();return `<div class="card"><h3>🏆 Wall of Fame</h3>${d.map((x,i)=>`<div class="row"><span style="font-size:1.4rem">${['🥇','🥈','🥉'][i]||'⭐'}</span><b>${esc(x.name)}</b><span class="b">${S.lb?bdgA(x.a):bdgTxt(x.id)}</span><span class="mu">${x.a} pts</span></div>`).join('')||'<span class="mu">لا بيانات</span>'}</div>`}
function tAi(){return `<div class="card"><h3>توليد أسئلة واختبار لحصة</h3><div class="row"><select id="qs">${S.lessons.map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)}</option>`).join('')}</select><button onclick="genQ()">🤖 ولّدي الأسئلة</button></div><div id="qo" class="ai" hidden></div></div>
<div class="card"><h3>تقرير ولي الأمر</h3><div class="row"><select id="rs">${S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button onclick="genRep('rs','ro')">🤖 اكتبي التقرير</button></div><div id="ro" class="ai" hidden></div></div>`}
async function genQ(){const l=S.lessons.find(x=>x.id===$('#qs').value);if(!l)return;const o=$('#qo');o.hidden=false;
 await ask(`اعتمادًا على هذه الحصة، ولّد 8 أسئلة متنوعة (اختيار من متعدد وصح/خطأ ومقالي) مع الإجابات النموذجية بالعربية.\nالدرس: ${l.t}\nالمحتوى: ${l.c}`,o);S.quiz[l.id]=o.textContent;pq=pq.then(push).catch(()=>{})}
async function genRep(sel,out){const s=stu($('#'+sel).value);if(!s)return;const o=$('#'+out);o.hidden=false;
 const hw=LS(s.id).map(l=>`حصة ${l.n} (${l.t}): ${S.att[l.id]?.[s.id]==='p'?'حضر':S.att[l.id]?.[s.id]==='a'?'غاب':'—'}، واجب: ${S.hw[l.id]?.[s.id]?(S.hw[l.id][s.id].grade||'لم يُصحَّح'):'لم يسلّم'}`).join('\n');
 await ask(`اكتب تقريراً احترافياً ودوداً بالعربية لولي أمر الطالب ${s.name}، من 5-7 أسطر، يشمل المستوى ونقاط القوة وما يحتاج تحسين ونصيحة.\nنسبة الحضور: ${attPct(s.id)}%، متوسط الواجبات: ${avg(s.id)}\nالتفاصيل:\n${hw}\nملاحظات المعلمة: ${S.notes[s.id]||'لا توجد'}`,o)}
// ---------- Student
function studentV(){const s=stu(who.id);if(!s){logout();return''}
 const T=[['ls','📚 الحصص'],['hw','📝 الواجبات'],['wr','✍️ My Writing · كتاباتي'],['lb','🏆 Wall of Fame'],['tu','💬 My Questions · أسئلتي']];
 return hdr('🎓 أهلاً '+esc(s.name)+' · Welcome!',T)+bdg(s.id)+({ls:sLs,hw:sHw,lb:()=>lb(),tu:sQ,wr:sW}[tab])(s)}
function sLs(){const L=[...LS(who.id)].reverse();return L.map((l,i)=>`<div class="card"><div class="top"><h3>حصة ${esc(l.n)}: ${esc(l.t)}</h3>${i===0?'<span class="b ok">الحالية</span>':'<span class="b">أرشيف</span>'}</div><span class="mu">${esc(l.d)}</span><p>${esc(l.c)}</p></div>`).join('')||'<div class="card mu">لا توجد حصص بعد</div>'}
function sHw(s){return LS(s.id).map(l=>{const h=S.hw[l.id]?.[s.id];return `<div class="card"><h3>حصة ${esc(l.n)}: ${esc(l.t)}</h3><p><b>الواجب:</b> ${esc(l.h)||'—'}</p>
${h?`<span class="b ok">تم التسليم</span> ${h.file?`<span class="mu">${esc(h.file)}</span>`:''}<p>${esc(h.text||'')}</p>${h.grade!==undefined&&h.grade!==''?`<p>الدرجة: <b>${esc(h.grade)}</b> — ${esc(h.fb||'')}</p>`:'<p class="mu">بانتظار التصحيح</p>'}`:
`<textarea id="t${l.id}" placeholder="اكتبي حل الواجب هنا"></textarea><div class="row"><input type="file" id="fl${l.id}" accept="image/*,.pdf"><button onclick="sub('${l.id}','${s.id}')">رفع الحل</button></div>`}</div>`}).join('')||'<div class="card mu">لا توجد واجبات</div>'}
function sub(l,s){const t=$('#t'+l).value.trim(),f=$('#fl'+l).files[0];if(!t&&!f)return alert('اكتب الحل أو ارفع ملفاً');(S.hw[l]=S.hw[l]||{})[s]={text:t,file:f?f.name:'',at:Date.now()};save()}
function sTu(s){return `<div class="card"><h3>اسألي مساعدك الذكي</h3><p class="mu">اشرح لي جزءاً من الدرس أو ساعدني في فهم خطأ في الواجب.</p><select id="tl">${LS(s.id).map(l=>`<option value="${l.id}">حصة ${esc(l.n)}: ${esc(l.t)}</option>`).join('')}</select><textarea id="tq" placeholder="اكتب سؤالك"></textarea><button onclick="tutor()">اسأل</button><div id="to" class="ai" hidden></div></div>`}
async function tutor(){const l=S.lessons.find(x=>x.id===$('#tl').value),q=$('#tq').value.trim();if(!q)return;const o=$('#to');o.hidden=false;
 await ask(`أنت مدرّس لطيف يشرح لطالب بأسلوب بسيط ومشجع بالعربية، دون إعطاء الحل النهائي للواجب مباشرة بل بتوجيهه خطوة بخطوة.\nالدرس: ${l?l.t:''}\nالمحتوى: ${l?l.c:''}\nسؤال الطالب: ${q}`,o)}
// ---------- Parent
function parentV(){const s=stu(who.id);if(!s){logout();return''}
 const T=[['sm','📊 الملخص'],['gr','📈 الدرجات'],['pm','💳 المدفوعات']];
 return hdr('👨‍👩‍👧 ولي أمر '+esc(s.name)+' · Parent',T)+({sm:pSm,gr:pGr,pm:pPm}[tab])(s)}
function pSm(s){return `<div class="row"><div class="card" style="flex:1">الحضور<h2>${attPct(s.id)}%</h2></div><div class="card" style="flex:1">Level · المستوى<h2 style="font-size:1rem">${bdgTxt(s.id)}</h2></div><div class="card" style="flex:1">المتبقي<h2>${due(s.id)} ج</h2></div></div>
<div class="card sc"><table><tr><th>الحصة</th><th>الموضوع</th><th>الحضور</th></tr>${LS(s.id).map(l=>{const v=S.att[l.id]?.[s.id];return `<tr><td>${esc(l.n)}</td><td>${esc(l.t)}</td><td>${v==='p'?'<span class="b ok">حضر</span>':v==='a'?'<span class="b no">غاب</span>':'—'}</td></tr>`}).join('')}</table></div>
<div class="card"><h3>ملاحظات المعلمة</h3><p>${esc(S.notes[s.id])||'<span class="mu">لا توجد ملاحظات</span>'}</p></div>`}
function pGr(s){return `<div class="card sc"><table><tr><th>الحصة</th><th>الدرجة</th><th>ملاحظة</th></tr>${LS(s.id).map(l=>{const h=S.hw[l.id]?.[s.id];return `<tr><td>${esc(l.t)}</td><td>${h?esc(h.grade??'قيد التصحيح'):'لم يسلّم'}</td><td>${esc(h?.fb||'')}</td></tr>`}).join('')}</table></div>`}
function pPm(s){return `<div class="card"><p class="mu">ارفعوا صورة (سكرين شوت) من عملية الدفع لكل حصة، والمعلمة هتراجعها.</p></div>`+LS(s.id).map(l=>{const pf=S.files.filter(f=>f.purpose==='proof'&&f.sid===s.id&&f.lid===l.id);return `<div class="card"><div class="top"><b>حصة ${esc(l.n)}: ${esc(l.t)}</b><span class="b">${esc(l.price)} ج</span></div>${pf.map(f=>`<div class="mu">📎 تم رفع صورة · ${new Date(f.at).toLocaleDateString('ar-EG')}</div>`).join('')}<div class="row"><input type="file" id="pf${l.id}" accept="image/*"><button onclick="upProof('${l.id}','${s.id}')">📤 رفع سكرين شوت</button></div></div>`}).join('')||'<div class="card mu">لا توجد حصص</div>'}
async function upProof(l,s){const f=$('#pf'+l).files[0];if(!f)return alert('اختاري صورة الأول');try{await fput(f,{purpose:'proof',lid:l});render()}catch(e){alert('تعذر الرفع: '+(e.message||e))}}

init();
</script></body></html>
